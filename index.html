/* ===== Propuesta B: Neo-chifa (porcelana con rojo de acento) ===== */
:root[data-estilo="neochifa"]{
  --fondo:#EEF2EC; --superficie:#FFFFFF; --superficie-2:#E3EAE3; --tinta:#1D2420; --tinta-2:#56635B; --borde:rgba(29,36,32,.12);
  --texto-fondo:#1D2420; --texto-fondo-2:#56635B; --acento:#C8102E; --acento-tinta:#FFFFFF;
  --primario:#C8102E; --primario-tinta:#FFFFFF;
  --cab:#EEF2EC; --cab-tinta:#1D2420; --cab-tinta-2:#56635B; --cab-linea:rgba(29,36,32,.12);
  --dock:#FFFFFF; --dock-tinta:#6B776F; --dock-activo:#C8102E;
  --hero-fondo:#FFFFFF; --hero-tinta:#1D2420; --hero-tinta-2:#56635B; --hero-borde:transparent;
  --mar:#CFDDD5; --porcelana:#FFFFFF; --borde-distrito:#E2A3A3; --callao:#E4E8E4; --distrito-activo:#FDE3E3; --contorno:#C8102E;
  --punto-borde:#FFFFFF; --laca-gato:#C8102E; --oro-gato:#D9A21B;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --display-peso:800; --display-tracking:-.4px; --pos-top:#C8102E;
  --texto:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sombra:0 6px 20px rgba(29,36,32,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root[data-estilo="neochifa"]:not([data-theme="light"]){
    --fondo:#121715; --superficie:#1B221F; --superficie-2:#24302A; --tinta:#EEF2EE; --tinta-2:#9FB0A7; --borde:rgba(238,242,238,.12);
    --texto-fondo:#EEF2EE; --texto-fondo-2:#9FB0A7; --acento:#FF4D5E; --primario:#E0283F; --pos-top:#FF4D5E;
    --cab:#121715; --cab-tinta:#EEF2EE; --cab-tinta-2:#9FB0A7; --cab-linea:rgba(238,242,238,.12);
    --dock:#1B221F; --dock-tinta:#8C9C94; --dock-activo:#FF4D5E;
    --hero-fondo:#1B221F; --hero-tinta:#EEF2EE; --hero-tinta-2:#9FB0A7;
    --mar:#0E1311; --porcelana:#1F2A25; --borde-distrito:#6A3A3E; --callao:#161C19; --distrito-activo:#3A2326; --contorno:#FF4D5E;
    --n1:#C5CDD3; --n2:#D58A57; --n3:#7A6D57; --n3-borde:#A8977A; --punto-borde:#1B221F;
    --sombra:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-estilo="neochifa"][data-theme="dark"]{
  --fondo:#121715; --superficie:#1B221F; --superficie-2:#24302A; --tinta:#EEF2EE; --tinta-2:#9FB0A7; --borde:rgba(238,242,238,.12);
  --texto-fondo:#EEF2EE; --texto-fondo-2:#9FB0A7; --acento:#FF4D5E; --primario:#E0283F; --pos-top:#FF4D5E;
  --cab:#121715; --cab-tinta:#EEF2EE; --cab-tinta-2:#9FB0A7; --cab-linea:rgba(238,242,238,.12);
  --dock:#1B221F; --dock-tinta:#8C9C94; --dock-activo:#FF4D5E; --hero-fondo:#1B221F; --hero-tinta:#EEF2EE; --hero-tinta-2:#9FB0A7;
  --mar:#0E1311; --porcelana:#1F2A25; --borde-distrito:#6A3A3E; --callao:#161C19; --distrito-activo:#3A2326; --contorno:#FF4D5E;
  --n1:#C5CDD3; --n2:#D58A57; --n3:#7A6D57; --n3-borde:#A8977A; --punto-borde:#1B221F; --sombra:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;font-family:var(--texto);color:var(--tinta);background:var(--fondo);font-size:15px;line-height:1.45;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cab)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.display{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking)}

/* ===== Cabecera ===== */
.cab{position:fixed;top:0;left:0;right:0;z-index:25;background:var(--cab);color:var(--cab-tinta);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:2px solid var(--cab-linea);display:flex;align-items:center;gap:10px}
.cab .mini-gato{width:32px;height:40px;flex:none}
.cab h1{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:19px;line-height:1.05;flex:1;min-width:0}
.cab h1 small{display:block;font-family:var(--texto);font-weight:500;font-size:12px;letter-spacing:0;color:var(--cab-tinta-2);margin-top:2px}
.btn-icono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--cab-linea);color:var(--cab-tinta);flex:none}
.btn-icono svg{width:19px;height:19px}

/* ===== Vistas ===== */
.vista{position:fixed;left:0;right:0;top:var(--cab-h,64px);bottom:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 20px)}
.vista[hidden]{display:none}
.contenedor{max-width:1100px;margin:0 auto;padding:14px 16px 0}

/* ===== Inicio ===== */
.principal{background:var(--bp-fondo);color:#FFF1D6;border:2px solid var(--acento);border-radius:24px;padding:18px 16px 16px;box-shadow:var(--sombra)}
.principal h2{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:26px;line-height:1.08;color:var(--oro-claro,#F4D27C)}
.buscar-grande{width:100%;height:54px;margin-top:12px;border-radius:27px;background:#FFF6E6;color:#6B5A50;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:16px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.buscar-grande svg{width:20px;height:20px;color:#8E1B1B}
.atajos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.atajo{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:14px;border:1.5px solid rgba(244,210,124,.55);color:#FFF1D6;font-weight:700;font-size:14px;text-align:left;background:rgba(255,255,255,.05)}
.atajo svg{width:18px;height:18px;flex:none;color:#F4D27C}
.atajo .punto{box-shadow:0 0 0 2px #FFF1D6}
.atajo .gato{width:20px;height:25px;flex:none}
.mi-distrito-linea{margin-top:10px;font-size:13px;color:#F2CFA0}
.mi-distrito-linea button{color:#F4D27C;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.selector-oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.buscar-falso{width:100%;height:46px;border-radius:23px;background:var(--superficie);color:var(--tinta-2);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;box-shadow:var(--sombra)}
.buscar-falso svg{width:18px;height:18px}
.mi-distrito{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--texto-fondo);font-size:14px;font-weight:600}
.mi-distrito select{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--borde);background:var(--superficie);color:var(--tinta);padding:0 10px;font-size:15px}
.bento{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.dato{position:relative;background:var(--superficie);color:var(--tinta);border-radius:20px;padding:16px 18px 14px;box-shadow:var(--sombra);display:flex;flex-direction:column}
.dato .dato-gato{position:absolute;right:12px;bottom:12px}
.dato-gato .gato{width:82px;height:101px}
.dato-eti{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--tinta-2)}
.dato-eti .ico-sello{width:24px;height:24px}
.vacio{display:flex;align-items:center;gap:10px}
.vacio .ico-sello{width:40px;height:40px}
.dato-cuerpo{display:block;text-align:left;min-height:118px;margin-top:6px;touch-action:pan-y}
.dato-cuerpo b{display:block;font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:38px;line-height:1.05;color:var(--pos-top)}
.dato-cuerpo span{display:block;font-size:15px;margin-top:6px;max-width:42ch;padding-right:84px}
.dato-cuerpo.cambia b,.dato-cuerpo.cambia span{animation:aparece .38s ease-out}
.dato-control{display:flex;align-items:center;gap:6px;margin-top:10px}
.dc-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--borde);color:var(--tinta)}
.dc-btn svg{width:15px;height:15px}
.dc-pos{font-size:12.5px;color:var(--tinta-2);font-weight:600;white-space:nowrap}
.zonas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zona{background:var(--superficie);color:var(--tinta);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sombra)}
.zona b{display:block;font-family:var(--display);font-weight:var(--display-peso);font-size:18px;line-height:1.1}
.zona span{display:block;font-size:12.5px;color:var(--tinta-2);margin-top:4px}
.f-foto{margin:-4px -4px 14px;border-radius:16px;overflow:hidden;position:relative;background:var(--superficie-2)}
.f-foto img{display:block;width:100%;height:150px;object-fit:cover}
.f-foto figcaption{position:absolute;right:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px}
.etq-distrito{pointer-events:none}
.etq-distrito div{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;font-family:var(--texto);font-size:11px;font-weight:600;line-height:1.15;color:#4A3A30;
  text-shadow:0 0 3px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.95),0 0 1px #fff}
.etq-distrito b{display:block;font-family:var(--display);font-weight:var(--display-peso);font-size:12.5px;color:#5E0F0F}
#mapa.sin-etiquetas .etq-distrito{display:none}
#mapa.etq-compactas .etq-distrito span{display:none}
.leyenda{position:absolute;left:12px;top:58px;z-index:500;background:var(--superficie);color:var(--tinta);border-radius:12px;padding:8px 10px;font-size:11.5px;box-shadow:var(--sombra);width:170px}
.leyenda b{display:block;font-size:12px;margin-bottom:5px}
.leyenda .escala{height:10px;border-radius:5px}
.leyenda .extremos{display:flex;justify-content:space-between;margin-top:3px;color:var(--tinta-2)}
.chip.modo{margin-right:6px}
.chip[disabled]{opacity:.45}
.hero{grid-column:1 / -1;position:relative;overflow:hidden;background:var(--hero-fondo);color:var(--hero-tinta);border-radius:24px;padding:18px 18px 16px;text-align:left;box-shadow:var(--sombra)}
.hero{display:block}
.hero-cuerpo{display:block;width:100%;text-align:left;color:inherit;min-height:140px;touch-action:pan-y}
.hero-cuerpo.cambia .h-eti,.hero-cuerpo.cambia .h-nombre,.hero-cuerpo.cambia .h-dist,.hero-cuerpo.cambia .h-pie{animation:aparece .38s ease-out}
@keyframes aparece{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.hero .h-eti,.hero .h-nombre,.hero .h-dist{display:block}
.hero-control{display:flex;align-items:center;gap:6px;margin-top:14px;position:relative;z-index:1}
.hc-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--hero-borde);color:var(--hero-tinta)}
:root[data-estilo="neochifa"] .hc-btn{border-color:var(--borde)}
.hc-btn svg{width:17px;height:17px}
.hc-pos{font-size:12.5px;color:var(--hero-tinta-2);font-weight:600;white-space:nowrap}
.hero-control .h-ver{margin-left:auto;white-space:nowrap}
.hero-control .h-ver{cursor:pointer}
.hero-progreso{height:3px;border-radius:2px;background:var(--hero-borde);margin-top:14px;overflow:hidden;position:relative;z-index:1}
.hero-progreso i{display:block;height:100%;width:0;background:var(--acento)}
.hero .h-eti{font-size:13px;font-weight:600;color:var(--hero-tinta-2)}
:root[data-estilo="evolucion"] .hero .h-eti,:root[data-estilo="evolucion"] .hero .h-nombre{padding-right:58px}
.hero .h-nombre{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:clamp(23px,6.4vw,30px);line-height:1.05;margin-top:8px;max-width:none;position:relative;z-index:1}
.hero .h-dist{margin-top:6px;color:var(--hero-tinta-2);font-weight:500;position:relative;z-index:1}
.hero .h-pie{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.hero .h-nota{font-weight:700}
.hero .h-ver{margin-left:auto;height:38px;padding:0 16px;border-radius:19px;background:var(--acento);color:var(--acento-tinta);font-weight:700;font-size:14px;display:flex;align-items:center}
.hero-num{position:absolute;pointer-events:none}
:root[data-estilo="evolucion"] .hero-num{right:16px;top:16px;width:46px;height:46px;font-size:23px!important;border-radius:50%;background:var(--acento);color:#2A1A14;display:grid;place-items:center;
  font-family:var(--display);font-size:30px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 0 0 3px #5E0F0F,0 0 0 4.5px var(--acento)}
:root[data-estilo="neochifa"] .hero-num{right:-8px;top:-46px;font-family:var(--display);font-weight:800;font-size:220px;line-height:1;color:var(--acento);opacity:.95;letter-spacing:-12px}
:root[data-estilo="neochifa"] .hero .h-nombre{max-width:11ch}
.medalla{align-self:flex-start;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:700;color:#2A1A14}
.medalla.n2{color:#fff}
.n0{background:var(--n0)} .n1{background:var(--n1)} .n2{background:var(--n2)} .n3{background:var(--n3)}
.tile{background:var(--superficie);color:var(--tinta);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:var(--sombra)}
.tile .t-eti{font-size:12.5px;font-weight:600;color:var(--tinta-2)}
.tile b.t-titulo{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:19px;line-height:1.08}
.tile .t-sub{font-size:13px;color:var(--tinta-2);margin-top:auto}
.tile-gato{align-items:flex-start;background:var(--acento);color:var(--acento-tinta)}
.tile-gato .gato{width:56px;height:70px}
:root[data-estilo="neochifa"] .tile-gato{--laca-gato:#6E0717}
:root[data-estilo="neochifa"] .cab h1{font-size:18px}
.tile-gato b{font-family:var(--display);font-weight:var(--display-peso);font-size:19px;line-height:1.08}
.tile-gato span{font-size:13px;opacity:.85}
.tile-proyecto{display:block;width:100%;margin-top:26px;text-align:left;background:transparent;color:var(--texto-fondo);border:1.5px dashed var(--texto-fondo-2);border-radius:20px;padding:14px 16px}
.tile-proyecto b{display:block;font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:19px;line-height:1.1}
.tile-proyecto span{display:block;font-size:13.5px;color:var(--texto-fondo-2);margin-top:6px}
.tile-dato{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile-dato .barras{display:flex;align-items:flex-end;gap:5px;height:58px;flex:none}
.tile-dato .barras i{display:block;width:12px;border-radius:4px 4px 0 0;background:var(--superficie-2)}
.tile-dato .barras i.alto{background:var(--acento)}
.tile-dato p{font-size:14px}
.tile-dato p b{font-weight:700}

.carrusel{margin-top:26px}
.carrusel-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:var(--texto-fondo)}
.ico-sello{width:30px;height:30px;flex:none}
.carrusel-cab h2{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:21px;line-height:1.1}
.carrusel-cab p{font-size:13px;color:var(--texto-fondo-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.carrusel-cab > div{min-width:0}
.ver-todos{font-size:14px;font-weight:700;color:var(--texto-fondo);text-decoration:underline;text-underline-offset:3px;flex:none}
.pista{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:2px 16px 8px;scrollbar-width:none}
.pista::-webkit-scrollbar{display:none}
.tarjeta{scroll-snap-align:start;background:var(--superficie);color:var(--tinta);border-radius:16px;padding:0 12px 12px;display:flex;flex-direction:column;text-align:left;overflow:hidden;min-height:176px;box-shadow:var(--sombra)}
.tarjeta .franja{display:flex;align-items:center;justify-content:space-between;margin:0 -12px 10px;padding:6px 12px;font-size:12px;font-weight:700;color:#2A1A14}
.tarjeta .franja.n2{color:#fff}
.tarjeta .franja span:last-child{font-family:var(--display);font-weight:var(--display-peso);font-size:16px}
.tarjeta b{font-weight:700;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarjeta .t-d{font-size:12.5px;color:var(--tinta-2);margin-top:4px}
.tarjeta .t-n{font-size:13px;font-weight:600;margin-top:auto;padding-top:8px}
.firma{text-align:center;margin:30px 0 6px;color:var(--texto-fondo-2);font-size:13px}
.firma button{text-decoration:underline;text-underline-offset:3px;font-weight:600;color:var(--texto-fondo);margin-top:6px}

/* ===== Ranking ===== */
.rk-cab{position:sticky;top:0;z-index:3;background:var(--fondo);padding:12px 16px 10px;border-bottom:1px solid var(--borde)}
.rk-cab .contenido{max-width:1100px;margin:0 auto}
.buscador{position:relative}
.buscador input{width:100%;height:44px;border-radius:22px;border:0;background:var(--superficie);color:var(--tinta);padding:0 40px;font-size:16px;box-shadow:var(--sombra)}
.buscador input::placeholder{color:var(--tinta-2)}
.buscador input::-webkit-search-cancel-button{display:none}
.buscador .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tinta-2)}
.buscador .limpiar{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--tinta-2);font-size:22px;line-height:1;text-align:center}
.rk-fila{display:flex;gap:8px;margin-top:10px;align-items:center}
.rk-fila select{height:38px;border-radius:12px;border:1.5px solid var(--borde);background:var(--superficie);color:var(--tinta);padding:0 8px;font-size:15px;max-width:52%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--borde);background:var(--superficie);color:var(--tinta);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--superficie);border-color:var(--tinta)}
.punto{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--punto-borde)}
.punto.n3{box-shadow:0 0 0 1.5px var(--n3-borde)}
.rk-resumen{max-width:1100px;margin:12px auto 0;padding:0 16px;color:var(--texto-fondo-2);font-size:13px}
.lista{list-style:none;max-width:1100px;margin:8px auto 0;padding:0 16px}
.lista li+li{margin-top:8px}
.fila{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;background:var(--superficie);color:var(--tinta);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--sombra)}
.fila .pos{font-family:var(--display);font-weight:var(--display-peso);font-size:17px;color:var(--tinta-2);text-align:center}
.lista li:nth-child(-n+3) .fila .pos{color:var(--pos-top)}
.fila b{display:block;font-size:15px;line-height:1.25}
.fila small{display:flex;align-items:center;gap:6px;color:var(--tinta-2);font-size:12.5px;margin-top:2px}
.fila .sc{font-family:var(--display);font-weight:var(--display-peso);font-size:19px}
.mas{display:block;margin:14px auto 0;height:44px;padding:0 22px;border-radius:22px;background:var(--superficie);color:var(--tinta);font-weight:700;box-shadow:var(--sombra)}
.vacio{max-width:1100px;margin:20px auto;padding:0 16px;color:var(--texto-fondo)}

/* ===== Mapa ===== */
#v-mapa{overflow:hidden;padding-bottom:0}
#mapa{position:absolute;inset:0;background:var(--mar)}
.leaflet-container{background:var(--mar);font-family:var(--texto)}
.leaflet-control-zoom{display:none}
.leaflet-pane.calles-pane{transition:opacity .35s}
.mapa-filtros{position:absolute;top:10px;left:0;right:0;z-index:500;display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.mapa-filtros::-webkit-scrollbar{display:none}
.mapa-filtros .chip{box-shadow:var(--sombra)}
.atribucion{position:absolute;right:8px;top:56px;z-index:500;font-size:10px;color:#3a3a3a;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:6px;pointer-events:none}
.previa{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:500;max-width:460px;margin:0 auto;
  background:var(--superficie);color:var(--tinta);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.previa .p-fila{display:flex;align-items:center;gap:8px}
.previa b{font-family:var(--display);font-weight:var(--display-peso);font-size:19px;line-height:1.1;display:block;margin-top:8px}
.previa p{color:var(--tinta-2);font-size:13.5px;margin-top:4px}
.previa .p-acciones{display:flex;gap:8px;margin-top:12px}
.previa .cerrar{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--superficie-2);font-size:18px;line-height:1;text-align:center}
.franja-mapa{position:absolute;left:0;right:0;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 6px);z-index:500;pointer-events:none}
.franja-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 8px;pointer-events:auto}
.franja-cab p{background:var(--superficie);color:var(--tinta);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:15px;box-shadow:var(--sombra);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.franja-btn{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--acento);color:var(--acento-tinta);font-weight:700;font-size:13.5px;box-shadow:var(--sombra)}
.franja-btn svg{width:17px;height:17px}
.franja-pista{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:8px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;scroll-snap-type:x mandatory;pointer-events:auto}
.franja-pista::-webkit-scrollbar{display:none}
.mini-tarjeta{scroll-snap-align:start;background:var(--superficie);color:var(--tinta);border-radius:16px;padding:10px 12px;text-align:left;box-shadow:var(--sombra);display:grid;grid-template-columns:12px 1fr;gap:3px 8px;align-items:center}
.mini-tarjeta b{font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tarjeta small{grid-column:2;color:var(--tinta-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tarjeta .dist{font-weight:700;color:var(--tinta)}
.btn{flex:1;min-height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;border:1.5px solid var(--tinta);color:var(--tinta);text-decoration:none;text-align:center}
.btn.primario{background:var(--primario);border-color:var(--primario);color:var(--primario-tinta)}

/* ===== El gato ===== */
.gato-vista{position:relative;max-width:520px;margin:0 auto;padding:18px 16px 0;text-align:center;color:var(--texto-fondo)}
.gato-grande{width:150px;height:184px;margin:0 auto;display:block}
.gato-vista h2{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:28px;line-height:1.05;margin-top:8px}
.gato-vista > p{color:var(--texto-fondo-2);margin-top:6px}
.panel{background:var(--superficie);color:var(--tinta);border-radius:22px;padding:16px;margin-top:16px;text-align:left;box-shadow:var(--sombra)}
.grupo+.grupo{margin-top:14px}
.grupo-titulo{font-weight:700;font-size:14px;margin-bottom:8px}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opcion{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--borde);font-size:14px;font-weight:600;background:var(--superficie)}
.opcion[aria-pressed="true"]{background:var(--tinta);color:var(--superficie);border-color:var(--tinta)}
.selector{margin-top:10px;width:100%;height:44px;border-radius:12px;border:1.5px solid var(--borde);background:var(--superficie-2);color:var(--tinta);padding:0 12px;font-size:16px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;margin-top:14px}
.interruptor input{width:22px;height:22px;accent-color:var(--primario)}
.elegir{width:100%;margin-top:16px;min-height:46px;border-radius:23px;border:1.5px solid var(--tinta);color:var(--tinta);font-weight:700;font-size:15px;text-align:center}
.gato-palanca{position:relative;width:150px;margin:6px auto 0}
.palanca-zona{position:absolute;left:96px;top:26px;width:60px;height:104px;touch-action:none;cursor:grab;border-radius:30px}
.palanca-zona:focus-visible{outline:3px solid var(--acento)}
.palanca-zona.jalando{cursor:grabbing}
.pista-palanca{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-weight:700;font-size:14.5px;color:var(--texto-fondo)}
.pista-palanca svg{width:18px;height:18px;color:var(--acento);animation:baja 1.2s ease-in-out infinite}
@keyframes baja{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px)}}
.ruleta{display:flex;align-items:center;justify-content:center;min-height:58px;max-width:360px;margin:12px auto 0;padding:8px 14px;border-radius:16px;background:var(--superficie);color:var(--tinta);border:3px solid var(--acento);box-shadow:inset 0 6px 10px rgba(0,0,0,.12);font-weight:800;font-size:16px;line-height:1.25;text-align:center}
.ruleta:empty{display:none}
.ruleta.girando{animation:tragamonedas .11s linear infinite}
@keyframes tragamonedas{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
.resultado{text-align:left}
.resultado b{font-family:var(--display);font-weight:var(--display-peso);font-size:24px;line-height:1.05;display:block;margin-top:8px}
.resultado p{color:var(--tinta-2);margin-top:4px}
.resultado .p-acciones{display:flex;gap:8px;margin-top:14px}

/* ===== Gato (SVG) ===== */
.gato .pata{transform-box:fill-box;transform-origin:50% 100%}
.gato .cabeza{transform-box:view-box;transform-origin:60px 78px}
.gato .ojos-abiertos{transform-box:fill-box;transform-origin:center;animation:parpadeo 5.2s infinite}
.gato .ojos-felices{display:none}
.gato.feliz .ojos-felices{display:inline}
.gato.feliz .ojos-abiertos{display:none}
.gato .cascabel{transform-box:fill-box;transform-origin:50% 0}
.gato.saluda .pata{animation:saludo .5s ease-in-out 4}
.gato.pensando .pata{animation:saludo .32s ease-in-out infinite}
.gato.pensando .cabeza{animation:ladea .9s ease-in-out infinite}
.gato.suena .cascabel{animation:tintineo .14s ease-in-out 8 alternate}
@keyframes saludo{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes ladea{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes tintineo{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.gato-toque{position:relative;display:inline-block;border-radius:24px;line-height:0}
.gato.salta{transform-box:fill-box;transform-origin:50% 100%;animation:salta .65s cubic-bezier(.3,1.5,.5,1)}
@keyframes salta{0%,100%{transform:translateY(0) scale(1)}15%{transform:scale(1.06,.92)}50%{transform:translateY(-16%) scale(.97,1.04)}80%{transform:translateY(0) scale(1.04,.96)}}
.gato .oreja{transform-box:fill-box}
.gato .oi{transform-origin:80% 100%} .gato .od{transform-origin:20% 100%}
.gato.orejas .oi{animation:orejaI .2s ease-in-out 4 alternate} .gato.orejas .od{animation:orejaD .2s ease-in-out 4 alternate}
@keyframes orejaI{to{transform:rotate(-14deg)}} @keyframes orejaD{to{transform:rotate(14deg)}}
.gato .ojo-d{transform-box:fill-box;transform-origin:center}
.gato.guino .ojo-d{animation:guino .7s ease-in-out}
@keyframes guino{0%,100%{transform:scaleY(1)}30%,70%{transform:scaleY(.1)}}
.gato.ronronea{animation:vibra .09s linear 12}
@keyframes vibra{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
.gato.ladeo .cabeza{animation:ladea .45s ease-in-out 2}
.burbuja{position:absolute;top:-4px;left:62%;background:var(--superficie);color:var(--tinta);font-family:var(--texto);font-weight:700;font-size:13px;line-height:1.2;padding:4px 10px;border-radius:12px;box-shadow:var(--sombra);white-space:nowrap;pointer-events:none;animation:burbuja 1.2s ease-out forwards;z-index:2}
@keyframes burbuja{0%{opacity:0;transform:translateY(6px)}15%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.corazon{position:absolute;bottom:45%;color:#E0475B;font-size:20px;line-height:1;pointer-events:none;animation:sube 1.2s ease-out forwards;z-index:2}
@keyframes sube{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.btn-sonido{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--texto-fondo-2);opacity:.7}
.btn-sonido svg{width:19px;height:19px}

/* ===== Capas (ficha, cómo funciona, historia) ===== */
.capa{position:fixed;inset:0;z-index:40;background:var(--fondo);display:flex;flex-direction:column;animation:entra .22s ease-out}
@keyframes entra{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.capa-cab{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--cab);color:var(--cab-tinta);border-bottom:2px solid var(--cab-linea)}
.atras{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px 0 8px;border-radius:19px;font-weight:700;font-size:14.5px;border:1.5px solid var(--cab-linea);color:var(--cab-tinta)}
.atras svg{width:18px;height:18px}
.capa-cab span{font-weight:600;font-size:14px;color:var(--cab-tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capa-cuerpo{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.capa-cuerpo > *{max-width:640px;margin-left:auto;margin-right:auto}
.ficha-tarjeta{background:var(--superficie);color:var(--tinta);border-radius:24px;padding:18px;box-shadow:var(--sombra)}
.ficha-tarjeta .etqs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.etq-suave{font-size:12.5px;color:var(--tinta-2);background:var(--superficie-2);padding:4px 10px;border-radius:12px}
.ficha-tarjeta h2{font-family:var(--display);font-weight:var(--display-peso);letter-spacing:var(--display-tracking);font-size:30px;line-height:1.04;margin-top:12px}
.ficha-tarjeta .f-d{color:var(--tinta-2);margin-top:6px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:2px solid var(--tinta);border-bottom:1px solid var(--borde)}
.cifras div{padding:10px 4px 12px}
.cifras div+div{border-left:1px dashed var(--borde);padding-left:12px}
.cifras b{display:block;font-family:var(--display);font-weight:var(--display-peso);font-size:24px;line-height:1.1}
.cifras span{display:block;font-size:12px;color:var(--tinta-2);margin-top:2px}
.f-acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.f-acciones .ancho{grid-column:1 / -1}
.aviso a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.aviso{margin-top:12px;font-size:12.5px;color:var(--tinta-2);padding:9px 11px;background:var(--superficie-2);border-radius:10px}
.porque{background:var(--superficie);color:var(--tinta);border-radius:20px;padding:16px 18px;margin-top:12px;box-shadow:var(--sombra)}
.porque h3,.metodo h3{font-family:var(--display);font-weight:var(--display-peso);font-size:18px;margin-bottom:10px}
.medidor{display:grid;grid-template-columns:100px 1fr;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:13px}
.medidor .barra{height:10px;border-radius:5px;background:var(--superficie-2);overflow:hidden}
.medidor .barra i{display:block;height:100%;background:var(--acento);border-radius:5px}
:root[data-estilo="evolucion"] .medidor .barra i{background:#D9A21B}
.medidor small{grid-column:2;color:var(--tinta-2);font-size:12px}
.porque p{font-size:14px;margin-top:8px}
.destaca{font-weight:700}
.metodo{background:var(--superficie);color:var(--tinta);border-radius:20px;padding:18px;box-shadow:var(--sombra)}
.metodo p{margin-bottom:12px}
.metodo h3{margin-top:18px}
.metodo h3:first-child{margin-top:0}
.niveles{list-style:none}
.niveles li{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--borde);font-size:14px}
.niveles .punto{margin-top:4px}
.niveles b{display:block}
.historia-img{display:block;width:min(100%,360px);margin:0 auto;border-radius:18px;box-shadow:var(--sombra)}
.historia-ayuda{text-align:center;color:var(--texto-fondo-2);font-size:13.5px;margin-top:12px}
.historia-acciones{display:flex;gap:10px;max-width:360px;margin:14px auto 0}

/* ===== Dock (navegación inferior) ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--dock);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.12);border-top:1px solid var(--borde)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dock-tinta);font-size:12px;font-weight:600;border-radius:14px}
.dock button svg{width:23px;height:23px}
.dock button[aria-current="page"]{color:var(--dock-activo)}
#gato-dock{width:62px;height:62px;margin-top:-30px;border-radius:50%;background:var(--cab);border:3px solid var(--oro-gato);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.dock .dock-gato .gato{width:34px;height:42px;display:block}
.dock .dock-gato[aria-current="page"] #gato-dock{border-color:var(--dock-activo);box-shadow:0 0 0 4px rgba(244,210,124,.25),0 6px 16px rgba(0,0,0,.35)}

.toast{position:fixed;left:50%;top:calc(var(--cab-h,64px) + 10px);transform:translate(-50%,-8px);z-index:60;background:var(--tinta);color:var(--superficie);
  padding:10px 16px;border-radius:18px;font-size:13.5px;font-weight:600;max-width:88vw;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.visible{opacity:1;transform:translate(-50%,0)}

@media (min-width:900px){
  .bento{grid-template-columns:3fr 2fr}
  .hero{grid-column:auto;padding:28px}
  .zonas{grid-template-columns:repeat(4,1fr)}
  .pista{grid-auto-columns:190px}
  .dock{left:50%;right:auto;bottom:18px;transform:translateX(-50%);width:520px;border-radius:24px;padding:6px;border:1px solid var(--borde)}
  .leaflet-control-zoom{display:block}
  .leaflet-top{top:56px}
  .previa{left:auto;right:24px;margin:0;bottom:24px;width:380px}
  .franja-mapa{bottom:96px}
}
@media (prefers-reduced-motion: reduce){
  .pista-palanca svg,.ruleta.girando{animation:none!important}
  .gato .pata,.gato .cabeza,.gato .ojos-abiertos,.gato .cascabel,.capa,.hero-cuerpo *{animation:none!important}
  .toast{transition:none}
}
</style>
</head>
<body>

<header class="cab" id="cab">
  <button class="mini-gato gato-toque" id="gato-mini" aria-label="Acariciar al gato"></button>
  <h1>Mi-chi Chifero<small id="cab-sub"></small></h1>
  <button class="btn-icono" id="compartir-app" aria-label="Compartir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
  </button>
</header>

<!-- INICIO -->
<section class="vista" id="v-inicio" aria-label="Inicio">
  <div class="contenedor">
    <section class="principal" aria-labelledby="principal-titulo">
      <h2 id="principal-titulo">¿Qué chifa buscas hoy?</h2>
      <button class="buscar-grande" id="ir-buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Busca un chifa o un distrito
      </button>
      <div class="atajos">
        <button class="atajo" id="at-cerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Cerca de mí</button>
        <button class="atajo" id="at-distrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span id="at-distrito-txt">Mi distrito</span></button>
        <button class="atajo" id="at-oro"><span class="punto n0"></span>Solo Oro</button>
        <button class="atajo" id="at-gato"><span id="gato-atajo"></span>Que el gato elija</button>
      </div>
      <p class="mi-distrito-linea" id="mi-distrito-linea" hidden></p>
      <select id="sel-mi-distrito" class="selector-oculto" aria-label="Elegir tu distrito" tabindex="-1"></select>
    </section>
    <div class="bento">
      <section class="hero" id="hero" aria-roledescription="carrusel" aria-label="Los número 1 de Lima, sus distritos y zonas">
        <button class="hero-cuerpo" id="hero-cuerpo"></button>
        <div class="hero-control">
          <button class="hc-btn" id="hero-prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="hc-btn" id="hero-pausa" aria-label="Pausar"></button>
          <button class="hc-btn" id="hero-sig" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
          <span class="hc-pos" id="hero-pos"></span>
          <span class="h-ver" aria-hidden="true">Ver ficha</span>
        </div>
        <div class="hero-progreso" aria-hidden="true"><i id="hero-barra"></i></div>
      </section>
      <section class="dato" id="dato" aria-roledescription="carrusel" aria-label="Datos chiferos">
        <span class="dato-eti" id="dato-eti">Dato chifero</span>
        <button class="gato-toque dato-gato" id="gato-dato" aria-label="Acariciar al gato científico"></button>
        <button class="dato-cuerpo" id="dato-cuerpo" aria-live="polite"></button>

function cascabel(){
  if (!leer('rcl_sonido', true)) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    [0, .16].forEach(d => [2093, 3136, 4186].forEach((f,k) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t+d); g.gain.exponentialRampToValueAtTime(.12/(k+1), t+d+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d+.5);
      o.connect(g).connect(audio.destination); o.start(t+d); o.stop(t+d+.55);
    }));
  } catch(e){}
}

function armarDatos(){
  const L = [];
  const masRes = C.reduce((a,c) => c.v > a.v ? c : a);
  L.push({num:fmt(masRes.v), txt:`reseñas tiene ${masRes.n}, el chifa más comentado de Lima.`});
  L.push({num:fmt(C.reduce((s,c) => s + c.v, 0)), txt:'reseñas en Google Maps suman todos los chifas de este ranking.'});
  const dMax = distritosConChifas.map(([d,i]) => [d, porDistrito[i].length]).sort((a,b) => b[1]-a[1])[0];
  L.push({num:fmt(dMax[1]), txt:`chifas tiene ${dMax[0]}, el distrito con más chifas del ranking.`});
  const zs = Object.keys(ZONAS).map(z => [z, promZona(z)]).sort((a,b) => b[1]-a[1]);
  L.push({num:`${zs[0][1].toFixed(2)}★`, txt:`es la nota promedio de ${zs[0][0]}, la más alta de las cuatro zonas de Lima.`});
  const perfectos = C.filter(c => c.r === 5 && c.v < 20).length;
  if (perfectos) L.push({num:fmt(perfectos), txt:'chifas tienen 5.0★ pero menos de 20 reseñas. No están arriba porque todavía falta que más gente lo confirme.'});
  const oro = C.filter(c => c.t === 0);
  L.push({num:fmt(oro.length), txt:`chifas tienen medalla de Oro, repartidos en ${new Set(oro.map(c => c.d)).size} de los ${distritosConChifas.length} distritos.`});
  const dAvg = distritosConChifas.filter(([,i]) => porDistrito[i].length >= 25)
    .map(([d,i]) => { const a = porDistrito[i].filter(c => c.r >= 1); return [d, a.reduce((s,c) => s + c.r, 0) / a.length]; }).sort((a,b) => b[1]-a[1])[0];
  if (dAvg) L.push({num:`${dAvg[1].toFixed(2)}★`, txt:`es la nota promedio de ${dAvg[0]}, la más alta entre los distritos con al menos 25 chifas.`});
  const stop = new Set(['chifa','chifas','restaurant','restaurante','del','los','las','chino','china','chinese','comida','express','the','food','san','santa','lima','sac','and']);
  const cnt = {};
  C.forEach(c => new Set(sinTildes(c.n).replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w => w.length > 2 && !stop.has(w) && !dists.some(d => sinTildes(d).split(/\s+/).includes(w)))).forEach(w => cnt[w] = (cnt[w] || 0) + 1));
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1])[0];
  if (top) L.push({num:`“${top[0].charAt(0).toUpperCase() + top[0].slice(1)}”`, txt:`es la palabra que más se repite en los nombres de los chifas: aparece en ${fmt(top[1])} de ellos.`});
  datos = L; datoK = 0; pintarDato(false); programarDato();
}

function armarHero(){
  const s = [{eti:'El número 1 de Lima', c:C[0], sub:dists[C[0].d]}];
  const md = estado.miDistrito;
  const conChifas = distritosConChifas.slice().sort((a,b) => a[0].localeCompare(b[0],'es'));
  if (md >= 0 && porDistrito[md].length) s.push({eti:`El número 1 de ${dists[md]}`, c:porDistrito[md][0], sub:`Tu distrito, elegido entre ${fmt(porDistrito[md].length)} chifas`});
  conChifas.forEach(([d,i]) => { if (i !== md) s.push({eti:`El número 1 de ${d}`, c:porDistrito[i][0], sub:`Elegido entre ${fmt(porDistrito[i].length)} chifas del distrito`}); });
  Object.keys(ZONAS).forEach(z => {
    const enZona = C.filter(x => zonaDe[dists[x.d]] === z);
    if (enZona.length) s.push({eti:`El número 1 de ${z}`, c:enZona[0], sub:`${dists[enZona[0].d]}, elegido entre ${fmt(enZona.length)} chifas de la zona`});
  });
  heroSlides = s; heroK = 0; pintarHero(false); programarHero();
}

}

function listaRanking(){
  let base = C;
  if (rk.donde === 'joyas') base = JOYAS;
  else if (rk.donde.startsWith('z:')) base = C.filter(c => zonaDe[dists[c.d]] === rk.donde.slice(2));
  else if (rk.donde.startsWith('d:')) base = porDistrito[+rk.donde.slice(2)];
  if (rk.nivel >= 0) base = base.filter(c => c.t === rk.nivel);
  if (rk.q){ const q = sinTildes(rk.q); base = base.filter(c => sinTildes(c.n).includes(q) || sinTildes(dists[c.d]).includes(q)); }
  return base;
}
function renderRanking(){
  if (document.activeElement !== $('#q')) $('#q').value = rk.q;
  $('#limpiar').hidden = !$('#q').value; $('#rk-donde').value = rk.donde;
  $$('#rk-niveles .chip').forEach(ch => ch.setAttribute('aria-pressed', +ch.dataset.n === rk.nivel ? 'true' : 'false'));
  const lista = listaRanking();
  const donde = rk.donde === 'joyas' ? 'joyas escondidas' : rk.donde.startsWith('z:') ? rk.donde.slice(2) : rk.donde.startsWith('d:') ? dists[+rk.donde.slice(2)] : 'toda Lima';
  $('#rk-resumen').textContent = lista.length ? `${fmt(lista.length)} chifas en ${donde}${rk.nivel >= 0 ? `, medalla ${NIVEL[rk.nivel]}` : ''}${rk.q ? `, que coinciden con “${rk.q}”` : ''}` : '';
  $('#rk-lista').innerHTML = lista.slice(0, rk.limite).map((c,k) => `<li><button class="fila" data-i="${c.i}">

function explicacion(c){
  const pN = Math.min(99, c.p_bayes), pV = Math.min(99, c.p_v);
  const nota = c.r >= PROM + .15 ? `Su nota de ${c.r.toFixed(1)}★ está por encima del promedio de los chifas de Lima (${PROM.toFixed(1)}★).`
    : c.r <= PROM - .15 ? `Su nota de ${c.r.toFixed(1)}★ está por debajo del promedio de los chifas de Lima (${PROM.toFixed(1)}★).`
    : `Su nota de ${c.r.toFixed(1)}★ está en el promedio de los chifas de Lima (${PROM.toFixed(1)}★).`;
  const respaldo = c.v < 20 ? `Todavía tiene pocas reseñas (${fmt(c.v)}), así que su nota se toma con pinzas y se acerca al promedio hasta que más gente lo confirme.`
    : `Lo respaldan ${fmt(c.v)} reseñas, más que el ${pV}% de los chifas.`;
  const destaca = c.dr <= Math.max(1, Math.ceil(porDistrito[c.d].length * .1));
  return `<section class="porque"><h3>¿Por qué este puntaje?</h3>
    <div class="medidor"><span>Nota ajustada</span><div class="barra"><i style="width:${Math.max(4,pN)}%"></i></div><small>Supera al ${pN}% de los chifas de Lima</small></div>
    <div class="medidor"><span>Respaldo</span><div class="barra"><i style="width:${Math.max(4,pV)}%"></i></div><small>Más reseñas que el ${pV}% de los chifas</small></div>
    <p>${nota} ${respaldo}</p>
    <p>Por eso es <b>${NIVEL[c.t]}</b>. ${SIGNIFICA[c.t]}</p>
    ${destaca ? `<p class="destaca">Destaca en ${esc(dists[c.d])}: está en el top 10% de su distrito.</p>` : ''}
    <p class="aviso">Esto refleja la opinión de la gente en Google Maps, no una verdad absoluta. ¿Opinas distinto? ${c.p ? `<a href="https://search.google.com/local/writereview?placeid=${c.p}" target="_blank" rel="noopener">Deja tu reseña en Google Maps</a>` : 'Deja tu reseña en Google Maps'}. En los videos de Garry Parra iremos a comprobar quién tenía razón.</p></section>`;
}
function urlMaps(c){
  return c.p ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.n)}&query_place_id=${c.p}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.n + ' ' + dists[c.d] + ' Lima')}`;
}
function renderFicha(c){
  $('#ficha-cab').textContent = `#${fmt(c.gr)} de ${fmt(TOTAL)} en Lima`;
  $('#ficha-cuerpo').innerHTML = `<article class="ficha-tarjeta">
    ${c.f ? `<figure class="f-foto"><img src="${esc(c.f)}" alt="Foto de ${esc(c.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"><figcaption>Foto de Google Maps</figcaption></figure>` : ''}
    <div class="etqs">${medalla(c)}<span class="etq-suave">${esc(subs[c.st])}</span></div>
    <h2>${esc(c.n)}</h2>
    <p class="f-d">${esc(dists[c.d])}, puesto ${fmt(c.dr)} de ${fmt(porDistrito[c.d].length)} en el distrito</p>
    <div class="cifras"><div><b>${Math.round(c.s)}</b><span>puntaje chifero</span></div><div><b>${c.r.toFixed(1)}★</b><span>en Google Maps</span></div><div><b>${fmt(c.v)}</b><span>reseñas</span></div></div>
    <div class="f-acciones">
      <a class="btn primario" href="${urlMaps(c)}" target="_blank" rel="noopener">Cómo llegar</a>
      <button class="btn" id="f-mapa">Ver en el mapa</button>
      <button class="btn ancho" id="f-historia">Crear historia para Instagram o TikTok</button>

    yo = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    const acc = Math.min(pos.coords.accuracy || 50, 400);
    if (mapa){
      if (!marcaYo){
        circuloYo = L.circle([yo.lat, yo.lon], {pane:'puntos', radius:acc, color:'#1A73E8', weight:1, fillColor:'#1A73E8', fillOpacity:.12, interactive:false}).addTo(mapa);
        marcaYo = L.circleMarker([yo.lat, yo.lon], {pane:'puntos', renderer:rPuntosG, radius:8, color:'#fff', weight:3, fillColor:'#1A73E8', fillOpacity:1, interactive:false}).addTo(mapa);
      } else { marcaYo.setLatLng([yo.lat, yo.lon]); circuloYo.setLatLng([yo.lat, yo.lon]).setRadius(acc); }
    }
    pintarBotonCerca();
    if (alListo) alListo();
  };
  /* Primero una ubicación rápida (wifi y antenas); si no responde, se intenta con GPS */
  navigator.geolocation.getCurrentPosition(exito, err => {
    if (err.code === 1) { fallar(1); return; }
    navigator.geolocation.getCurrentPosition(exito, e2 => fallar(e2.code), {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  }, {enableHighAccuracy:false, timeout:9000, maximumAge:300000});
}
$('#btn-cerca').addEventListener('click', () => {
  if (modoCerca){ modoCerca = false; pintarBotonCerca(); actualizarFranja(); return; }
  if (modoDistrito) alternarModoDistrito();
  ubicarme(() => {
    modoCerca = true; pintarBotonCerca(); cerrarPrevia();
    const lejos = km(yo, {lat:-12.06, lon:-77.03}) > 60;
    if (lejos) avisar('Parece que no estás en Lima. Igual te muestro los chifas más cercanos.');
    mapa.flyTo([yo.lat, yo.lon], lejos ? 11 : 14.5, {duration: reduceMotion ? 0 : .8});
    actualizarFranja();
  });
});

/* ---------- El gato ---------- */
const prefs = leer('rcl_antojo2', {donde:'lima', nivel:1, dist:-1});
const TXT_ELEGIR = 'O toca aquí y elijo por ti';
opcionesDistrito($('#op-distrito'));
function pintarOpciones(){
  const ops = [['lima','Toda Lima']];
  if (estado.miDistrito >= 0) ops.push(['mio', `En ${dists[estado.miDistrito]}`]);
  ops.push(['elegir','Otro distrito'], ['cerca','Cerca de mí']);
  if (prefs.donde === 'mio' && estado.miDistrito < 0) prefs.donde = 'lima';
  $('#op-donde').innerHTML = ops.map(([v,t]) => `<button class="opcion" data-v="${v}" aria-pressed="${prefs.donde === v}">${esc(t)}</button>`).join('');
  $('#op-distrito').hidden = prefs.donde !== 'elegir';
  if (prefs.dist >= 0) $('#op-distrito').value = prefs.dist;
  $$('#op-nivel .opcion').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === prefs.nivel ? 'true' : 'false'));
}
$('#op-donde').addEventListener('click', e => { const b = e.target.closest('.opcion'); if (b){ prefs.donde = b.dataset.v; pintarOpciones(); } });
$('#op-nivel').addEventListener('click', e => { const b = e.target.closest('.opcion'); if (b){ prefs.nivel = +b.dataset.v; pintarOpciones(); } });
$('#op-distrito').addEventListener('change', e => prefs.dist = +e.target.value);
function pintarSonido(){
  const on = leer('rcl_sonido', true), b = $('#btn-sonido');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', on ? 'Silenciar el cascabel' : 'Activar el cascabel');
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 9.5-4.9M18 11v5l1.5 2h-11"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg>';
}
$('#btn-sonido').addEventListener('click', () => { guardar('rcl_sonido', !leer('rcl_sonido', true)); pintarSonido(); if (leer('rcl_sonido', true)) cascabel(); });
pintarSonido();
const REACCIONES = ['saluda','salta','orejas','guino','ronronea','corazones','ladeo'];
let ultimaReaccion = '';
function burbuja(cont, texto){ const s = document.createElement('span'); s.className = 'burbuja'; s.textContent = texto; cont.appendChild(s); setTimeout(() => s.remove(), 1250); }
function corazones(cont){
  for (let k = 0; k < 5; k++){ const h = document.createElement('span'); h.className = 'corazon'; h.textContent = '♥';
    h.style.left = (20 + Math.random()*60) + '%'; h.style.animationDelay = (k*90) + 'ms'; cont.appendChild(h); setTimeout(() => h.remove(), 1700); }
}
function mimar(cont){
  const g = cont.querySelector('.gato'); if (!g || eligiendo) return;
  try { navigator.vibrate && navigator.vibrate(12); } catch(e){}
  if (reduceMotion){ burbuja(cont, '¡miau!'); return; }
  let r; do { r = REACCIONES[Math.floor(Math.random()*REACCIONES.length)]; } while (r === ultimaReaccion);
  ultimaReaccion = r;
  if (r === 'ronronea'){ animar(g, 'feliz', 1100); animar(g, 'ronronea', 1100); burbuja(cont, 'prrr…'); }
  else if (r === 'corazones'){ animar(g, 'feliz', 1200); corazones(cont); }
  else if (r === 'guino'){ animar(g, 'guino', 700); burbuja(cont, '¡miau!'); }
  else animar(g, r, {saluda:2000, salta:650, orejas:800, ladeo:950}[r]);
}
$('#gato-grande').addEventListener('click', () => mimar($('#gato-grande')));
/* Palanca: jalar la manita del gato hacia abajo */
const zonaPalanca = $('#palanca-zona');
const pataGrande = () => $('#gato-grande .pata');
let tiron = null;
function moverPata(p){ const el = pataGrande(); if (el) el.style.transform = `rotate(${Math.round(p*150)}deg)`; zonaPalanca.setAttribute('aria-valuenow', Math.round(p*100)); }
function regresarPata(){
  const el = pataGrande(); if (!el) return;
  el.style.transition = reduceMotion ? 'none' : 'transform .55s cubic-bezier(.3,1.6,.5,1)'; el.style.transform = 'rotate(0deg)';
  setTimeout(() => { el.style.transition = ''; el.style.transform = ''; zonaPalanca.setAttribute('aria-valuenow', 0); }, 600);
}
function jalar(){ if (eligiendo) return; try { navigator.vibrate && navigator.vibrate(25); } catch(e){} regresarPata(); $('#elegir').click(); }
zonaPalanca.addEventListener('pointerdown', e => {
  if (eligiendo) return;
  zonaPalanca.setPointerCapture(e.pointerId); zonaPalanca.classList.add('jalando');
  const g = $('#gato-grande .gato'); g.classList.remove('saluda','pensando','salta','ladeo');
  const el = pataGrande(); if (el) el.style.transition = 'none';
  tiron = {y0:e.clientY, p:0, aviso:false};
});
zonaPalanca.addEventListener('pointermove', e => {
  if (!tiron) return;
  tiron.p = Math.max(0, Math.min(1, (e.clientY - tiron.y0) / 90)); moverPata(tiron.p);
  if (tiron.p > .6 && !tiron.aviso){ tiron.aviso = true; try { navigator.vibrate && navigator.vibrate(10); } catch(err){} }
});
function soltar(cancelado){
  if (!tiron) return; const p = tiron.p; tiron = null; zonaPalanca.classList.remove('jalando');
  if (!cancelado && p >= .6){ jalar(); return; }
  regresarPata();
  if (!cancelado && p < .1) burbuja($('#gato-palanca'), '¡Jálame hacia abajo!');
}
zonaPalanca.addEventListener('pointerup', () => soltar(false));
zonaPalanca.addEventListener('pointercancel', () => soltar(true));
zonaPalanca.addEventListener('keydown', e => {
  if (['Enter',' ','ArrowDown'].includes(e.key)){ e.preventDefault(); if (eligiendo) return; moverPata(1); setTimeout(jalar, reduceMotion ? 0 : 220); }
});
$('#gato-mini').addEventListener('click', () => mimar($('#gato-mini')));
$('#gato-dato').addEventListener('click', e => { e.stopPropagation(); mimar($('#gato-dato')); });
const km = (a, b) => { const R = 6371, r = x => x*Math.PI/180, dLa = r(b.lat-a.lat), dLo = r(b.lon-a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
let ultimo = null, eligiendo = false;
const pozo = extra => C.filter(c => c.t <= prefs.nivel && c !== ultimo && extra(c));
$('#elegir').addEventListener('click', () => {
  if (eligiendo) return;
  guardar('rcl_antojo2', prefs);
  if (prefs.donde === 'cerca'){
    $('#elegir').textContent = 'Buscando dónde estás…';
    ubicarme(() => {
      $('#elegir').textContent = TXT_ELEGIR;
      let p = [];
      for (const r of [2, 4, 7]){ p = pozo(c => km(yo, c) <= r); if (p.length) break; }
      p.length ? sortear(p, 'cerca de ti') : avisar('No encontré chifas con ese nivel cerca de ti. Prueba con “Cualquiera”.');
    }, () => { $('#elegir').textContent = TXT_ELEGIR; });
    return;
  }
  let p, donde;
  if (prefs.donde === 'mio' && estado.miDistrito >= 0){ p = pozo(c => c.d === estado.miDistrito); donde = `en ${dists[estado.miDistrito]}`; }
  else if (prefs.donde === 'elegir'){ const d = +$('#op-distrito').value; prefs.dist = d; p = pozo(c => c.d === d); donde = `en ${dists[d]}`; }
  else { p = pozo(() => true); donde = 'en Lima'; }
  p.length ? sortear(p, donde) : avisar(`No hay chifas con ese nivel ${donde}. Prueba con uno más amplio.`);
});
function sortear(p, donde){
  eligiendo = true;
  const c = p[Math.floor(Math.random() * p.length)]; ultimo = c;
  const g = $('#gato-grande .gato'), ruleta = $('#ruleta'), res = $('#resultado');
  ruleta.classList.add('girando');
  res.hidden = true;
  const revelar = () => {
    if (g){ g.classList.remove('pensando'); animar(g, 'feliz', 2600); animar(g, 'suena', 1200); }
    animar($('#gato-dock .gato'), 'saluda', 2000);
    cascabel();
    ruleta.classList.remove('girando');
    ruleta.textContent = '¡Hoy te toca!';
    res.hidden = false;
    res.innerHTML = `<div class="p-fila">${medalla(c)}<span class="etq-suave">${esc(dists[c.d])}</span></div>
      <b>${esc(c.n)}</b><p>${c.r.toFixed(1)}★ en ${fmt(c.v)} reseñas, puesto ${fmt(c.gr)} de ${fmt(TOTAL)} en Lima.</p>
      <div class="p-acciones"><button class="btn primario" data-ver2="${c.i}">Ver ficha</button><button class="btn" id="otra-vez">Elegir otro</button></div>`;
    res.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'});
    eligiendo = false;
  };
  if (reduceMotion){ revelar(); return; }
  if (g) g.classList.add('pensando');
  const muestra = p.length > 1 ? p : C; let k = 0;
  const giro = setInterval(() => { ruleta.textContent = `Pensando ${donde}… ${muestra[Math.floor(Math.random()*muestra.length)].n}`; if (++k > 12){ clearInterval(giro); revelar(); } }, 105);
}
$('#resultado').addEventListener('click', e => {
  const v = e.target.closest('[data-ver2]'); if (v) abrirFicha(C[+v.dataset.ver2]);
  if (e.target.closest('#otra-vez')) $('#elegir').click();
});
setInterval(() => { if (document.visibilityState === 'visible' && !eligiendo) animar($('#gato-dock .gato'), 'saluda', 2000); }, 11000);

/* ---------- Historia 9:16 para Instagram o TikTok ---------- */
function lineas(ctx, texto, ancho){
  const pal = texto.split(' '), out = []; let l = '';
  pal.forEach(p => { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > ancho && l){ out.push(l); l = p; } else l = t; });
  if (l) out.push(l); return out;
}
async function crearHistoria(c){
  try { await document.fonts.ready; } catch(e){}
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const evo = ESTILO === 'evolucion';
  const fondo = evo ? '#8E1B1B' : '#EEF2EC', tinta = evo ? '#FFF1D6' : '#1D2420', tinta2 = evo ? '#F2CFA0' : '#56635B', acento = evo ? '#E0A82E' : '#C8102E';
  const disp = cssv('--display'), peso = cssv('--display-peso'), txt = cssv('--texto');
  x.fillStyle = fondo; x.fillRect(0, 0, W, H);
  if (evo){ x.strokeStyle = acento; x.lineWidth = 8; x.strokeRect(48, 48, W-96, H-96); x.lineWidth = 3; x.strokeRect(70, 70, W-140, H-140); }
  x.textAlign = 'center'; x.fillStyle = evo ? acento : tinta;
  x.font = `${peso} 64px ${disp}`; x.fillText('Mi-chi Chifero', W/2, 200);
  x.font = `500 38px ${txt}`; x.fillStyle = tinta2; x.fillText(`${fmt(TOTAL)} chifas según Google Maps`, W/2, 258);
  const svg = gatoSVG({laca: evo ? '#6F1212' : '#C8102E', oro:'#D9A21B'}).replace(' class="gato"', '').replace('<g class="ojos-abiertos">','<g style="display:none">').replace('class="ojos-felices"','');
  const img = new Image();
  await new Promise(r => { img.onload = r; img.onerror = r; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  try { x.drawImage(img, W/2 - 170, 330, 340, 425); } catch(e){}
  const colMed = [cssv('--n0'), cssv('--n1'), cssv('--n2'), cssv('--n3')][c.t];
  x.fillStyle = colMed; const mw = 420, mh = 88; x.beginPath(); x.roundRect ? x.roundRect(W/2-mw/2, 820, mw, mh, 44) : x.rect(W/2-mw/2, 820, mw, mh); x.fill();
  x.fillStyle = c.t === 2 ? '#fff' : '#2A1A14'; x.font = `700 44px ${txt}`; x.fillText(`Medalla ${NIVEL[c.t]}`, W/2, 880);
  x.fillStyle = evo ? '#FFF6E6' : tinta;
  let tam = 104; x.font = `${peso} ${tam}px ${disp}`;
  let ls = lineas(x, c.n, W - 200);
  while (ls.length > 3 && tam > 64){ tam -= 8; x.font = `${peso} ${tam}px ${disp}`; ls = lineas(x, c.n, W - 200); }
  let y = 1040; ls.slice(0,3).forEach(l => { x.fillText(l, W/2, y); y += tam * 1.05; });
  x.fillStyle = tinta2; x.font = `500 46px ${txt}`; x.fillText(dists[c.d], W/2, y + 10);
  y += 200;
  x.fillStyle = evo ? acento : '#C8102E'; x.font = `${peso} 150px ${disp}`; x.fillText(`${c.r.toFixed(1)}★`, W/2, y);
  x.fillStyle = tinta; x.font = `600 44px ${txt}`; x.fillText(`${fmt(c.v)} reseñas en Google Maps`, W/2, y + 76);
  x.fillText(`Puesto ${fmt(c.gr)} de ${fmt(TOTAL)} en Lima`, W/2, y + 136);
  x.fillStyle = evo ? acento : tinta; x.font = `${peso} 52px ${disp}`;
  x.fillText('¿Cuál es el mejor de tu distrito?', W/2, H - 210);
  x.globalAlpha = .55; x.fillStyle = tinta2; x.font = `500 28px ${txt}`; x.fillText('Garry Parra', W/2, H - 118); x.globalAlpha = 1;
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  const archivo = new File([blob], `chifa-${c.n.replace(/[^\wáéíóúñ]+/gi,'-').toLowerCase()}.png`, {type:'image/png'});
  navegar({capa:'historia'});
  const puedeArchivos = navigator.canShare && navigator.canShare({files:[archivo]});
  $('#historia-cuerpo').innerHTML = `<img class="historia-img" src="${url}" alt="Historia de ${esc(c.n)} para compartir">
    <p class="historia-ayuda">${puedeArchivos ? 'Compártela directo en tu historia.' : 'Mantén presionada la imagen (o clic derecho) y elige “Guardar imagen”. Luego súbela a tu historia.'}</p>
    ${puedeArchivos ? `<div class="historia-acciones"><button class="btn primario" id="h-compartir">Compartir imagen</button></div>` : ''}`;
  if (puedeArchivos) $('#h-compartir').onclick = async () => { try { await navigator.share({files:[archivo], title:'Mi-chi Chifero'}); } catch(e){} };
}

/* ---------- Compartir enlace ---------- */
async function compartir(c){
  const base = location.href.split(/[?#]/)[0];
  const url = c && c.p ? `${base}?chifa=${encodeURIComponent(c.p)}` : base;
  const texto = c ? `${c.n} (${dists[c.d]}) es ${NIVEL[c.t]} en Mi-chi Chifero: ${c.r.toFixed(1)}★ en ${fmt(c.v)} reseñas, puesto ${fmt(c.gr)} de ${fmt(TOTAL)}.`
    : `${fmt(TOTAL)} chifas de Lima ordenados según sus reseñas en Google Maps. Busca el mejor de tu distrito.`;
  if (navigator.share){ try { await navigator.share({title:'Mi-chi Chifero', text:texto, url}); return; } catch(err){ if (err && err.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(`${texto} ${url}`); avisar('Enlace copiado. Pégalo en WhatsApp o donde quieras.'); }
  catch(err){ avisar('Copia la dirección de esta página para compartirla.'); }
}
$('#compartir-app').addEventListener('click', () => compartir(estado.ficha));
let tA;
function avisar(m, ms = 2800){ const t = $('#toast'); t.style.top = estado.tab === 'mapa' ? 'calc(var(--cab-h,64px) + 62px)' : ''; t.textContent = m; t.classList.add('visible'); clearTimeout(tA); tA = setTimeout(() => t.classList.remove('visible'), ms); }

/* ---------- Tema ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
const repintar = () => { if (!mapa) return; capaDistritos.setStyle(estiloDistrito); marcadores.forEach(m => m.setStyle(estiloPunto(m._c.t))); calles.setUrl(urlCalles()); probarCalles(); dibujarContorno(); };
mq.addEventListener ? mq.addEventListener('change', repintar) : mq.addListener(repintar);

medirCab(); addEventListener('resize', () => { medirCab(); if (mapa) mapa.invalidateSize(); });

const pidEnlace = new URLSearchParams(location.search).get('chifa') || (location.hash.startsWith('#c=') ? decodeURIComponent(location.hash.slice(3)) : null);
pila.push(foto());
try { history.replaceState({d:0}, '', location.pathname); } catch(e){ historialOk = false; }
if (pidEnlace && porPlace[pidEnlace]) setTimeout(() => navegar({ficha:porPlace[pidEnlace].i}), 100);
